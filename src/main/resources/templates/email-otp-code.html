<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{html/base}"
>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title th:text="#{connectionCode(${email})}">Email otp code</title>
</head>
<body>
<h2 layout:fragment="page_header" id="page_header" th:text="#{greeting(${name})}"></h2>
<div layout:fragment="page_content" id="page_content">
    <p style="font-weight: bold; text-align: center; font-size: 24px;" th:text="${OtpCode}">message content</p>

    <p th:text="#{codeOtpForLogin(${expiredOtpTime})}">message content</p>
    <p th:text="#{warningResetPasswordMessage}">If you didn't make this request then you can safely ignore this email.</p>
</div>
</body>
</html>
